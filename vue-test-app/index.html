<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark" data-theme-setting="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F7FA" media="(prefers-color-scheme: light)" />
    <title>Prisdoc · 智能文档平台</title>
    <script>
      /* 首屏就定好主题，避免亮色用户看到一闪而过的深色底 */
      (function () {
        try {
          var saved = localStorage.getItem('prisdoc-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = saved === 'light' || saved === 'dark'
            ? saved
            : saved === 'system'
              ? (prefersDark ? 'dark' : 'light')
              : 'dark'
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.themeSetting = saved || 'dark'
          document.documentElement.classList.toggle('dark', resolved === 'dark')
        } catch (e) { /* 忽略：隐私模式下读不到 localStorage */ }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
